<!doctype html>
<html lang="pt-AO">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Marketplace Angola</title>
    <link rel="stylesheet" href="/assets/css/vendors/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="base-bg-color">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="pro-bg-white p-4 rounded-3 shadow-sm">
                    <h1 class="h3 mb-4">Entrar na sua conta</h1>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-bg-theme w-100" type="submit">Entrar</button>
                    </form>
                    <p class="mt-3 mb-0">Ainda não tem conta? <a href="{% url 'accounts:register' %}">Criar conta</a></p>
                    <p class="mt-2 mb-0"><a href="{% url 'accounts:password_reset' %}">Recuperar palavra-passe</a></p>
                </div>
            </div>
        </div>
    </main>
    <script src="/assets/js/marketplace-i18n.js?v=20260815i18n13"></script>
</body>
</html>
