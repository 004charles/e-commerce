<!doctype html>
<html lang="pt-AO">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidatura de vendedor | Marketplace Angola</title>
    <link rel="stylesheet" href="/assets/css/vendors/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="base-bg-color">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="pro-bg-white p-4 p-lg-5 rounded-3 shadow-sm">
                    <h1 class="h3 mb-2">Torne-se vendedor</h1>
                    <p class="template-text-content mb-4">Envie os dados da sua loja. A candidatura será analisada pela nossa equipa antes da publicação.</p>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-bg-theme" type="submit">Enviar candidatura</button>
                        <a class="btn btn-outline-secondary ms-2" href="/">Voltar à homepage</a>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="/assets/js/marketplace-i18n.js?v=20260815i18n13"></script>
</body>
</html>
