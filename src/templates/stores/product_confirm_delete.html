<!doctype html>
<html lang="pt-AO">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remover produto | {{ store.name }}</title>
    <link rel="stylesheet" href="/assets/css/vendors/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="base-bg-color">
    <main class="container py-5">
        <section class="pro-bg-white rounded-3 p-4 p-md-5 shadow-sm mx-auto" style="max-width: 640px;">
            <p class="template-text-content mb-1">Área do vendedor</p>
            <h1 class="h3">Remover produto</h1>
            <p>Tem a certeza de que deseja remover o produto <strong>{{ product.name }}</strong>?</p>
            <p class="text-muted">Esta ação não pode ser desfeita.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Remover produto</button>
                <a class="btn btn-light" href="{% url 'stores:dashboard' %}">Cancelar</a>
            </form>
        </section>
    </main>
    <script src="/assets/js/marketplace-i18n.js?v=20260815i18n13"></script>
</body>
</html>
